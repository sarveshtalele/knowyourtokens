<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Know Your Tokens reel end card</title>
<!-- Rendered to a 1080x1920 PNG and appended to the Instagram reel (see docs/launch/PRODUCT_HUNT.md). -->
<style>
  @font-face { font-family: 'Inter'; src: url('fonts/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMonoVariable.woff2') format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fbfbfd; color: #1d1d1f;
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(700px 600px at 85% 0%, rgba(124,108,255,.18), transparent 70%),
                radial-gradient(700px 600px at 0% 100%, rgba(45,212,191,.14), transparent 70%); }
  main { position: absolute; inset: 190px 70px 345px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .avatar { width: 380px; height: 380px; border-radius: 50%; padding: 9px; background: linear-gradient(135deg, #7c6cff, #ec4899 55%, #2dd4bf); }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; border: 7px solid #fff; object-fit: cover; display: block; box-sizing: border-box; }
  .kicker { margin-top: 54px; font-size: 30px; font-weight: 700; letter-spacing: .2em; color: #7c6cff; text-transform: uppercase; }
  h1 { margin: 14px 0 0; font-size: 104px; line-height: 1; letter-spacing: -.045em; font-weight: 800; }
  .g { background: linear-gradient(100deg, #7c6cff, #ec4899 55%, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .creds { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 46px; }
  .creds span { font-size: 32px; font-weight: 650; padding: 16px 30px; border-radius: 999px; background: #fff; border: 1.5px solid #e5e5ea;
    box-shadow: 0 12px 32px -20px rgba(20,20,40,.4); }
  .cta { margin-top: 50px; display: flex; align-items: center; gap: 18px; background: #111118; color: #f5f5f7; border-radius: 26px;
    padding: 22px 34px; font: 600 38px 'JetBrains Mono', ui-monospace, monospace; }
  .cta img { width: 64px; height: 64px; border-radius: 16px; }
</style>
</head>
<body>
<main>
  <div class="avatar"><img src="creator.jpg" alt="Sarvesh Talele" /></div>
  <div class="kicker">Built by</div>
  <h1>Sarvesh <span class="g">Talele</span></h1>
  <div class="creds">
    <span>AI Engineer</span><span>2x Claude Certified Architect</span><span>NASA ADS Research Paper</span>
    <span>HarvardX AI Certified</span><span>Guinness World Record Holder</span>
  </div>
  <div class="cta"><img src="../../../site/public/icon-192.png" alt="" />npx knowyourtokens</div>
</main>
</body>
</html>
