[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentelemetry-client"
version = "2.2.0"
description = "Client for the Token Telemetry local API: token, tool, skill and MCP observability for AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sarvesh Talele" }]
keywords = ["ai-agents", "claude-code", "codex", "gemini-cli", "opencode", "llm", "telemetry", "tokens", "observability", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://sarveshtalele.github.io/tokentelemetry/"
Source = "https://github.com/sarveshtalele/tokentelemetry"
Issues = "https://github.com/sarveshtalele/tokentelemetry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokentelemetry_client = ["py.typed"]
