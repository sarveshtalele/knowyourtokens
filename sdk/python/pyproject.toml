[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knowyourtokens-client"
version = "2.3.1"
description = "Client for the Know Your Tokens local API: token, tool, skill and MCP observability for AI coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "Sarvesh Talele" }]
keywords = ["ai-agents", "claude-code", "codex", "gemini-cli", "opencode", "llm", "telemetry", "tokens", "observability", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://sarveshtalele.github.io/knowyourtokens/"
Source = "https://github.com/sarveshtalele/knowyourtokens"
Issues = "https://github.com/sarveshtalele/knowyourtokens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowyourtokens_client = ["py.typed"]
