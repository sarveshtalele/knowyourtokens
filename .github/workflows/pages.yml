name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/openapi.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Base path and canonical URL follow the repository name, so renaming the repo just works.
      - run: npm run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tell Bing, Yandex, Seznam and Naver (IndexNow) that the page changed so they recrawl it within
      # minutes. The key is public by design: it's served as site/public/<key>.txt. Google doesn't use
      # IndexNow; it reads the sitemap submitted in Search Console. Best effort, never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          INDEXNOW_KEY: 3b5ca7eef18b9f431a7fad923beddddd
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          url, key = os.environ["PAGE_URL"], os.environ["INDEXNOW_KEY"]
          body = {
              "host": urllib.parse.urlparse(url).hostname,
              "key": key,
              "keyLocation": f"{url}{key}.txt",
              "urlList": [url, f"{url}sitemap.xml"],
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow:", r.status, body["urlList"])
          PY
