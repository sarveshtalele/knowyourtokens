name: Release

# Publishes the CLI (`knowyourtokens`) and the JS SDK (`knowyourtokens-client`) to npm and creates
# the GitHub release. Nothing to run locally:
#
#   * Every push to main checks whether the version in cli/package.json is on npm yet. If it isn't,
#     it is tested, published and released. If it is, the run stops after a few seconds.
#   * To ship a new version: Actions -> Release -> Run workflow, pick patch / minor / major. It bumps
#     every version, moves the CHANGELOG's Unreleased notes under it, commits to main and publishes.
#     (Or bump the version in a PR; merging it publishes.)
#   * Pushing a vX.Y.Z tag, or publishing a release in the GitHub UI, works too.
#
# Every step skips what's already done, so re-running is always safe. npm auth: the NPM_TOKEN
# repository secret (a granular token with read+write on all packages and "Bypass two-factor
# authentication" ticked), or Trusted Publishing (OIDC, no secret) once the packages exist.
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = publish the version already on main)"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: read

# One release at a time, whatever started it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide what to release
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for pushing the version-bump commit
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Bump the version and commit it to main
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }} # via env, never interpolated into the script
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run the Release workflow from the main branch to bump the version"; exit 1
          fi
          v="$(node scripts/bump-version.mjs "$BUMP")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: v$v"
          if ! git push origin HEAD:main; then
            echo "::error::Couldn't push the version bump to main (is main protected?). Allow GitHub Actions to bypass the rule, or bump the version in a PR and merge it; that publishes too."
            exit 1
          fi
          echo "Bumped to $v"
      - id: v
        name: Version, commit, and whether anything is left to do
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          {
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          publish=true
          # A push to main whose version is already published and tagged: nothing to release.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
             && npm view "knowyourtokens@$version" version >/dev/null 2>&1 \
             && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify versions, tests, build
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Every package version matches
        run: |
          want="${{ needs.prepare.outputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cli/package.json ($want)"; exit 1
          fi
          # Every place scripts/bump-version.mjs writes the version.
          python3 - "$want" <<'PY'
          import json, re, sys
          want, bad = sys.argv[1], []
          def check(where, got):
              if got != want:
                  bad.append(f"{where}: {got}")
          for f in ("telemetry/__init__.py", "sdk/python/src/knowyourtokens_client/__init__.py"):
              check(f, re.search(r'^__version__ = "(.+)"', open(f).read(), re.M).group(1))
          check("sdk/python/pyproject.toml", re.search(r'^version = "(.+)"', open("sdk/python/pyproject.toml").read(), re.M).group(1))
          for d in ("cli", "sdk/js", "frontend", "site", "vscode"):
              check(f"{d}/package.json", json.load(open(f"{d}/package.json"))["version"])
              try:
                  lock = json.load(open(f"{d}/package-lock.json"))
              except FileNotFoundError:
                  continue
              check(f"{d}/package-lock.json", lock["version"])
          check("docs/openapi.json", json.load(open("docs/openapi.json"))["info"]["version"])
          for b in bad:
              print(f"::error::{b} (expected {want}; run node scripts/bump-version.mjs {want})")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-dev.txt && python -m pytest -q
      - run: cd frontend && npm ci && npm run build

  npm-cli:
    name: Publish CLI to npm
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) needs npm >= 11.5.1. If an NPM_TOKEN secret
      # exists it is used instead.
      - run: npm install -g npm@latest
      - name: Publish (skipped if this version is already on npm)
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          if npm view "knowyourtokens@$v" version >/dev/null 2>&1; then
            echo "knowyourtokens@$v is already published"; exit 0
          fi
          npm publish --provenance --access public || {
            echo "::error::npm publish failed. EOTP / one-time password: the NPM_TOKEN secret must be a granular token with 'Bypass two-factor authentication' ticked, or set up Trusted Publishing. E404/E403 on PUT: the token needs read+write on this package (choose 'All packages' for a first publish)."
            exit 1
          }

  npm-sdk:
    name: Publish JS SDK to npm
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - name: Publish (skipped if this version is already on npm)
        working-directory: sdk/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${{ needs.prepare.outputs.version }}"
          if npm view "knowyourtokens-client@$v" version >/dev/null 2>&1; then
            echo "knowyourtokens-client@$v is already published"; exit 0
          fi
          npm ci
          npm publish --provenance --access public || {
            echo "::error::npm publish failed. EOTP / one-time password: the NPM_TOKEN secret must be a granular token with 'Bypass two-factor authentication' ticked, or set up Trusted Publishing. E404/E403 on PUT: the token needs read+write on this package (choose 'All packages' for a first publish)."
            exit 1
          }

  github-release:
    name: Create GitHub release
    needs: [prepare, npm-cli, npm-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.prepare.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create the release (and its tag) unless it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.prepare.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists -- leaving it as is"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes-file notes.md --verify-tag
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --target "${{ needs.prepare.outputs.sha }}"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build the VS Code extension and attach it to the release
        # The site links to releases/latest/download/knowyourtokens.vsix, so the file name must not change.
        working-directory: vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run package
          gh release upload "v${{ needs.prepare.outputs.version }}" knowyourtokens.vsix --clobber

  redeploy-site:
    name: Redeploy the website with the new version
    # A bump committed by this workflow (GITHUB_TOKEN) doesn't trigger pages.yml on its own.
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
