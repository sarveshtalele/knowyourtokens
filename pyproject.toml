[project]
name = "tokentelemetry"
dynamic = ["version"]
description = "Local-first token, tool, skill & MCP observability for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sarvesh Talele" }]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["app.py", "tests/test_dashboard.py", "sdk/python/build", "docs/superpowers"]

[tool.ruff.lint]
# Pinned explicitly: ruff's default selection changes between releases.
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() in defaults is the intended idiom
  "B904",  # raise ... from None is used deliberately where it matters
  "E501",  # the formatter owns line length; long lines left are SQL string literals
]

[tool.ruff.lint.per-file-ignores]
# The SDK supports Python 3.9: keep typing.Optional/List spellings there.
"sdk/python/**" = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["telemetry", "app", "tokentelemetry_client"]

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]

[tool.coverage.run]
source = ["telemetry", "backend/app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
